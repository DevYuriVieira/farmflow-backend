name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Ubuntu / Real Infra)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: farmflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d farmflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Disable Runner Host PostgreSQL
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl disable postgresql || true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Keycloak IdP
        run: |
          docker run -d --name keycloak \
            -p 8081:8080 \
            -p 9000:9000 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v ${{ github.workspace }}/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro \
            quay.io/keycloak/keycloak:26.1.0 \
            start-dev --import-realm --health-enabled=true

      - name: Wait for Keycloak Readiness
        run: |
          echo "Waiting for Keycloak to become healthy..."
          for i in {1..60}; do
            if curl -s -f http://127.0.0.1:8081/realms/farmflow/.well-known/openid-configuration; then
              echo "Keycloak is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak readiness wait completed."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Compile Application
        run: ./mvnw -B compile

      - name: Run Automated Test Suites
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/farmflow
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: guest
          SPRING_RABBITMQ_PASSWORD: guest
        run: ./mvnw -B test

      - name: Annotate Surefire Test Failures
        if: failure()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, glob
          for f in glob.glob('**/surefire-reports/TEST-*.xml', recursive=True):
              tree = ET.parse(f)
              for tc in tree.findall('.//testcase'):
                  for fl in tc.findall('failure'):
                      name = tc.attrib.get('name', 'unknown')
                      cls = tc.attrib.get('classname', 'unknown')
                      msg = fl.attrib.get('message', '')
                      print(f'::error title={cls}.{name}::{msg}')
                  for er in tc.findall('error'):
                      name = tc.attrib.get('name', 'unknown')
                      cls = tc.attrib.get('classname', 'unknown')
                      msg = er.attrib.get('message', '')
                      print(f'::error title={cls}.{name}::{msg}')
          "