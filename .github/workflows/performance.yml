name: Performance Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Benchmark suite to execute (Health, Telemetry, Stress, RateLimit, All)'
        required: true
        default: 'Telemetry'
        type: choice
        options:
          - Health
          - Telemetry
          - Stress
          - RateLimit
          - All
  schedule:
    - cron: '0 3 * * 0'

jobs:
  performance-benchmark:
    name: Execute k6 Performance & Capacity Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: farmflow_bench
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d farmflow_bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Disable Runner Host PostgreSQL
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl disable postgresql || true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Keycloak IdP
        run: |
          docker run -d --name keycloak \
            -p 8081:8080 \
            -p 9000:9000 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v ${{ github.workspace }}/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro \
            quay.io/keycloak/keycloak:26.1.0 \
            start-dev --import-realm --health-enabled=true

      - name: Wait for Keycloak Readiness
        run: |
          echo "Waiting for Keycloak to become healthy..."
          for i in {1..60}; do
            if curl -s -f http://127.0.0.1:8081/realms/farmflow/.well-known/openid-configuration; then
              echo "Keycloak is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak readiness wait completed."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install k6
        run: |
          sudo gpg -k || true
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Package Application JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Start FarmFlow API (Capacity Profile)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/farmflow_bench
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: guest
          SPRING_RABBITMQ_PASSWORD: guest
          SERVER_PORT: 8080
        run: |
          nohup java -jar target/farmflow-backend-0.0.1-SNAPSHOT.jar > api.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          sleep 10

      - name: Verify API Health
        run: |
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8080/v1/health/ready; then
              echo "API is healthy and ready!"
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Run k6 Benchmarks
        env:
          SELECTED_SUITE: ${{ github.event.inputs.suite || 'Telemetry' }}
        shell: pwsh
        run: |
          ./load-tests/run-benchmarks.ps1 -BaseUrl "http://127.0.0.1:8080/v1" -K6Path "k6" -Suite $env:SELECTED_SUITE

      - name: Upload API Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-benchmark-log
          path: api.log