spring.application.name=farmflow-backend-test
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

farmflow.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
farmflow.jwt.expiration-ms=86400000
farmflow.outbox.interval-ms=60000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always