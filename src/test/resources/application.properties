spring.application.name=farmflow-backend-test
spring.threads.virtual.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:farmflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

farmflow.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
farmflow.jwt.expiration-ms=86400000
farmflow.outbox.interval-ms=60000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
